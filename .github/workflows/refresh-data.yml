name: Refresh Bazaar Brief shared data

on:
  push:
    paths-ignore:
      - 'public/data/**'
  # Market feed: every hour from 10:00 through 17:00 IST, Monday-Friday.
  # GitHub cron is UTC; IST is UTC+5:30.
  schedule:
    - cron: '30 4-11 * * 1-5'
    # IPO + FII/DII feed: every 2 hours, every day. This also refreshes the
    # market dataset so the final exchange close can be published after 15:45 IST.
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bazaarbrief-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Refresh official/free shared dataset
        env:
          GIFT_NIFTY_SYMBOL: ${{ vars.GIFT_NIFTY_SYMBOL }}
        run: node scripts/refresh-data.mjs
      - name: Commit refreshed shared data
        run: |
          git config user.name 'Bazaar Brief Data Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data/latest.json
          git diff --cached --quiet || git commit -m "chore: refresh live market and IPO data"
          git pull --rebase origin main
          git push
