name: Refresh Bazaar Brief shared data

on:
  push:
    paths-ignore:
      - 'public/data/**'
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh free live API dataset
        env:
          GIFT_NIFTY_SYMBOL: ${{ vars.GIFT_NIFTY_SYMBOL }}
          IPOGURU_API_KEY: ${{ secrets.IPOGURU_API_KEY }}
        run: node scripts/refresh-data.mjs
      - name: Commit refreshed shared data
        run: |
          git config user.name 'Bazaar Brief Data Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data/latest.json
          git diff --cached --quiet || git commit -m "chore: refresh free market and IPO data"
          git push
