# Legacy standalone Worker config. The root ../wrangler.jsonc is authoritative for
# the combined static-site + API deployment. No placeholder KV namespace IDs are
# included here; configure MARKET_CACHE in the root config after creating your KV namespace.
name = "bazaarbrief-data"
main = "src/index.ts"
compatibility_date = "2026-10-13"
workers_dev = true

[triggers]
crons = ["*/15 * * * *"]

[vars]
ALLOWED_ORIGIN = "https://bazaarbrief.in"
PUBLIC_ORIGIN = "https://bazaarbrief.in"
